# Cloudflare Pages config. See CLOUDFLARE.md for the full deploy walkthrough.
name = "wohl"
compatibility_date = "2024-09-23"

# Where `npm run cf:build` (expo export -p web) writes the static site.
# Recent wrangler versions read this so `wrangler pages dev` / `deploy` don't
# need an explicit directory argument -- pass one anyway (see package.json)
# in case your installed wrangler version predates this field.
pages_build_output_dir = "dist"

# Rate limiting for the AI-backed / external-API routes (functions/_lib/
# rateLimit.ts), replacing the in-memory limiter server/index.js uses locally
# -- Workers/Pages Functions have no reliable memory across requests, so that
# approach silently under-counts in production.
#
# NOTE ON SYNTAX: this must be `[[unsafe.bindings]]` with `type = "ratelimit"`,
# not the newer top-level `[[ratelimits]]` block. Workers rate limiting only
# went GA in September 2025; wrangler 3.x (pinned in package.json) predates
# that and silently DISCARDS `[[ratelimits]]` as an unknown field, reporting
# "No bindings found" -- which, combined with checkRateLimit()'s fail-open
# behavior, left the OpenAI-backed endpoints completely uncapped in
# production. Verified with `wrangler pages dev`: the unsafe form reports
# `ratelimit: RATE_LIMITER [connected to remote resource]` and returns 429 on
# the 3rd request within the window, while `[[ratelimits]]` let everything
# through. Cloudflare's GA changelog confirms unsafe bindings keep working.
#
# If you upgrade to wrangler 4.x, switch this to `[[ratelimits]]` and re-run
# the same check -- do not assume it carried over.
#
# `simple.period` only supports 10 or 60 (seconds) -- there's no direct
# equivalent of "30 requests per 15 minutes", so this approximates it as
# 2 requests/minute per client (2 * 15 = 30). Adjust `limit` if you want a
# looser or tighter cap.
#
# The "unsafe fields are experimental" warning on startup is expected.
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 2, period = 60 }
